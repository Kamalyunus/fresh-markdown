# Perishable Markdown MVP -- single tuning surface (PRD section 7).
#
# Every threshold, constant, window, and rate in the system lives here.
# Code reads config; code contains no numeric literals for anything tunable.
#
# MEASURED      produced by phase 0 (section 8); the system refuses to start
#               while any runtime-required MEASURED value is null.
# SET           business or design choice.
# SET BY OWNER  blocking decision; null until the PRD owner supplies it.

meta:
  config_version: "1.0.0"

artifacts:
  bundle_path: "artifacts/bundle.json"   # SET  the sealed bundle manifest

data:
  split_manifest_path: "artifacts/split_manifest.json"   # SET
  exclusion_window:                    # SET  known demand-issue period
    start: "2026-04-25"
    end:   "2026-06-03"
  split:                               # SET  baseline fitting only
    train_start: "2026-03-01"
    train_end:   "2026-07-13"
    calib_start: "2026-07-14"
    calib_end:   "2026-07-27"
    test_start:  "2026-07-28"
    test_end:    "2026-08-03"
    # An episode is a maximal run of consecutive hourly rows for one sku x fc
    # over which flc_window (hours_remaining) ticks down exactly one per
    # elapsed hour -- see prepare_data.assign_episode_ids, which is the
    # authoritative definition. NOT keyed by calendar date: 36-hour windows
    # are common and a date key splits one economic episode into three.
  holdout:                             # SET  a TRUE hold-out: no artifact is
    start: "2026-08-04"                # fit on it and no gate was decided on
    end:   "2026-08-21"                # it. Everything above stops at
    # test_end, so standing at test_end and running this window forward is
    # the only unrehearsed test the extract can give -- the shadow gate, the
    # drift ratio and the tau derivation all report 1.00x or in-sample
    # numbers on any window they were fitted against.
    #
    # ONE SHOT. The moment a value is tuned on this window and re-run, it
    # stops being a hold-out and becomes a second calibration set. Decide
    # what each run is for before running it.
    #
    # Episodes are assigned by the date their WINDOW OPENED
    # (common.episodes.window_slice), so no episode straddles the seam.
  # Extract-edge truncation is NOT a config switch any more. An episode the
  # extract cut off mid-window is FLAGGED `edge_truncated` and kept: only its
  # ENDING is unknown, its observed hours are ordinary demand data, and it is
  # among the LARGEST episodes in the extract. Every scrap and IL consumer
  # already excludes an unclosed ending on its own -- scrap_units returns NaN,
  # backtest.replay zeroes scrap under outcome_known, shadow charges scrap
  # only on COMPLETED -- so the drop was protecting a figure that was already
  # protected while starving mu_ref and r of the slow, heavily-stocked
  # windows. Read `share_of_unclosed_explained_by_edge` in the dp_eligible
  # waterfall row beside m11.not_closed_by_month: near 1.0 and the unknown
  # scrap was purely the extract boundary; well below, with months evenly
  # loaded, and the feed has a standing problem no re-download will fix.
  max_window_hours: 120                # SET  upper bound on a plausible FLC
    # window. flc_window carries occasional very large values from upstream
    # data issues; an episode claiming a window longer than this is FLAGGED
    # window_too_long and excluded from dp_eligible -- not dropped. The bound
    # is a DP-side safety rail, not an integrity test: episodes are extended
    # to their full window before mu_ref PREDICTION, so an unbounded counter
    # would generate unbounded synthetic rows, and extend_to_window raises
    # rather than hanging above this bound. Only backtest and shadow extend,
    # and both filter to dp_eligible first. The three artifact fits never
    # extend and never read the counter, so a long window costs them nothing.
    # Raised 48 -> 120 by the owner: 48 was cutting legitimate multi-day
    # windows, not just defects. Note the cost -- this bound also sizes the
    # synthetic tail, so the widest window drives DP horizon and prediction
    # work per episode.
  manufacturing_window_hours: 24       # SET  standard clearance window for
    # SKUs whose flc_window enters ALREADY negative -- a large negative
    # constant rather than a countdown. Episodes matching that pattern are
    # recovered with a synthetic countdown from this value instead of being
    # dropped; any that run LONGER than this are not the pattern and are
    # dropped with their count reported. Verify the cap against the extract
    # before trusting it: the recovery rests on it.
    #
    # NOT a dial anywhere: which episodes have an UNKNOWN outcome is decided
    # by the source's own closure sentinel -- ending_inventory zeroed on the
    # final row while stock remained -- in common.episodes.classify_last.
    # There is no tolerance constant and never key that rule to
    # hours_remaining: the counter is nominal and still positive on ~99.5% of
    # final rows.

reassessment_gates:                    # SET  section 8.1 phase-0 review gates
  max_share_non_explorable: 0.30       # above this, narrow the MVP to the
    # explorable subset -- too many episodes have a cost floor so tight that
    # fewer than min_feasible_tiers discounts exist, so exploration cannot buy
    # evidence there at any price
  max_share_cells_low_variation: 0.50  # above this, the bracket is not
    # estimable and posterior.prior.source must fall back: too few
    # (category, hour) cells carry same-hour price variation to identify from

baseline_model:
  objective: "tweedie"                 # SET
  tweedie_variance_power: 1.3          # SET
  ref_rate_window_days: 30             # SET  trailing window for sku_ref_sales_rate
  ref_rate_anchor_band: 0.025          # SET  |d - d_ref| band defining anchor hours
  learning_rate: 0.05                  # SET
  num_boost_round: 400                 # SET
  num_leaves: 63                       # SET
  min_data_in_leaf: 50                 # SET
  train_population: "eligible"         # SET  which rows the FROZEN ARTIFACTS
    # are fit on -- mu_ref, the dispersion r, rho, the elasticity prior and
    # the level factors.
    #
    # "integrity"    every episode that survived the filter chain, including
    #                those whose accounting does not close.
    # "eligible"     the episode identity holds -- opening + restocked ==
    #                sold + scrap -- AND the final hour is clean
    #                (starting >= sold). DEFAULT.
    # "dp_eligible"  "eligible" plus what the SOLVER additionally needs: a
    #                feasible tier, a readable horizon, one inventory pool.
    #
    # Default "eligible", and the reason is the CENSORED LIKELIHOOD. The
    # demand model cannot see the inventory chain -- FEATURES carries neither
    # `cost` nor `hours_remaining` -- so for a while the argument was that
    # every surviving episode is an ordinary demand observation to it. That
    # is wrong in one place: the likelihood treats an hour as censored when
    # the shelf ran out, and that call is read off the inventory. An episode
    # whose units went missing, or whose final hour is ambiguous, has a
    # censoring flag that cannot be trusted -- and a wrong censoring flag
    # biases demand directly.
    #
    # Everything the DP additionally rejects IS invisible to the model, so
    # those episodes stay in: a missing cost, an unreadable horizon and a
    # mid-window restock all leave the sales and the censoring intact.
    #
    # Note a below-cost HOUR is not one of the three conditions. It is a
    # price the legacy policy set and the agent is constrained never to set,
    # so it is a property of the history rather than a defect: the backtest's
    # DP arm is self-anchored and never sees it, and in shadow the refusal it
    # causes from that hour onward is the cost floor working. Those episodes
    # stay dp_eligible and carry `below_cost_hours` for the record -- which
    # also means the widest price spread in the extract now reaches the
    # elasticity bracket, the quantity most starved of variation.
    #
    # The risk of "integrity" is covariate shift: the model is fit on a
    # distribution wider than the one it serves. That is measurable, not
    # arguable -- `fidelity.by_dp_eligibility` reports the anchor ratio on
    # the DP-eligible subset either way. Run both, read that number, keep the
    # winner.
    #
    # NOT a choice anywhere else. The DP, the calibration GATE, tau and the
    # A/B always read dp_eligible: they act on, or grade, the priceable book
    # only. The cost floor is unaffected either way -- it is structural in
    # `pricing.dp.feasible_tiers`, not a filter.
  freeze_at_launch: true               # SET  no retraining in MVP window
  model_path: "artifacts/baseline_model.txt"
  feature_schema_path: "artifacts/feature_schema.json"
  calibration_gate_band: [0.90, 1.10]  # SET BY OWNER 2026-08-09. Weekly sold
    # ratios swing +-8% around the level (measured, fidelity.by_week); a
    # 3-week pooled gate therefore carries ~4.6% sigma, and the original
    # [0.95, 1.05] band was ~1 sigma wide -- a coin flip on natural
    # volatility. This band is ~2 sigma; the continuous guard is the daily
    # realised_vs_predicted_sold_ratio in shadow and production.
  calibration_grain: "subcategory"     # SET  "subcategory" | "category".
    # Factors are solved at every level of a subcategory -> category ->
    # global hierarchy (mirroring dispersion.fallback_order) and each level
    # is shrunk toward its parent by the evidence behind it, so thin cells
    # inherit the parent rather than contributing noise -- no threshold
    # cliff, and zero evidence lands exactly on the parent factor.
  calibration_shrinkage_units: 100     # SET  pseudo-count, in anchor units
    # sold, pulling a cell toward its parent. A cell with this many units has
    # equal weight on itself and its parent.
  calibration_min_anchor_rows: 200     # SET  anchor basis needs this many rows
  mix_decomposition_min_unit_rows: 30  # SET  anchor rows before a SKU x FC
    # ratio is trusted in the mix decomposition; thinner units fall back to
    # their category ratio
  calibration_gate_metric: "level_at_anchor"  # SET BY OWNER 2026-08-09
    # ("pooled_ratio" | "level_at_anchor"). The model's only production job
    # is predicting demand at the reference discount -- inference always
    # overwrites price to d_ref and the parametric layer (mu_ref x ratio^e)
    # handles every other price. The pooled ratio judges the model at
    # ACTUAL, mostly deep-discount prices and is therefore hostage to the
    # elasticity prior, the quantity the system exists to learn in
    # production (measured: anchor ~1.0 on train+calib while pooled sat at
    # 1.17 on slope alone). level_at_anchor gates the frozen artifact on
    # its own responsibility; slope stays visible via
    # slope_ratio_by_discount_gap and is validated by posterior movement
    # and the A/B, with the daily drift ratio as the production guard.
  calibration_window_sweep_weeks: [1, 2, 4, 8]  # SET  trailing-window lengths
    # tested by the rolling-origin calibration sweep in the backtest report:
    # fit factors on the trailing W weeks, apply to the next week, measure the
    # anchor ratio that results. Under a trending level a LONGER window is
    # more stale, not more accurate -- the sweep decides W with data.
  calibration_fit_trailing_weeks: 2    # SET BY OWNER 2026-08-09  weeks used by
    # the "trailing" fit window: recent enough to track a moving demand level,
    # long enough for stable anchor-row counts.
  calibration_gate_window: "test"      # SET  "test" | "calib+test". Must be
    # DISJOINT from the fit window, or the gate grades its own fit. With
    # fit_window "calib" the pairing is the split's intended design: train ->
    # calib (fit factors, out-of-sample) -> test (gate, out-of-sample and
    # later still), which is exactly production's fit-on-trailing,
    # apply-forward protocol. Note a one-week test window carries the full
    # weekly demand noise; widen test_end when the extract allows.
  calibration_fit_window: "train+calib"  # SET BY OWNER 2026-08-09. The short
    # windows were tried first and lost on production data: the calib
    # fortnight was itself the most anomalous stretch in the five-month
    # weekly series (1.06 against a 1.30 mean), so factors fit on it inherited
    # that anomaly and pushed the gate the wrong way. train+calib passed
    # (level_bias_at_anchor 1.0395). The level deficit being corrected is a
    # systematic Tweedie sum-calibration artifact, not drift, so averaging
    # more history targets the persistent component and lets no single week
    # dominate. Still disjoint from the gate window (test).
    # "trailing" | "calib" |
    # "train+calib" | "all". "trailing" = the last
    # calibration_fit_trailing_weeks of data ENDING WHERE THE GATE WINDOW
    # BEGINS -- fit and evaluation never overlap, so the gate cannot grade
    # its own fit, and the protocol mirrors production (fit on trailing data,
    # apply forward). Longer windows average more history and are more stale
    # when the level moves; calibration_window_sweep measures which wins.
    # Measured weekly sold-ratios swing +-8% around a persistent level deficit;
    # factors fit on one fortnight inherit that fortnight's anomaly (the 07-13
    # calib week measured 1.06 against a five-month mean of 1.30). A long fit
    # window targets the persistent component only.
  calibration_factor_path: "artifacts/calibration.json"   # per-category level correction
  apply_level_calibration: null        # DECIDE after section 9.3 diagnostic; null blocks start

reference_discount:                    # SET  category anchors
  MEAT: 0.25
  SIDE_DISH: 0.25
  _default: 0.30

dispersion:
  fallback_order: ["subcategory", "category", "global"]
  clamp_percentile: 0.90               # SET  clamp high converged r
  min_rows_per_group: 200              # SET  below this: fall back one level
  r_search_bounds: [0.05, 50.0]        # SET  MLE search range for r
  r_lookup_path: "artifacts/r_lookup.json"
  rho_path: "artifacts/rho.json"
  rho: 0.3103                          # MEASURED  bootstrap.fit_dispersion,
    # against FITTED mu_ref residuals -- NOT phase 0's m3, which is a
    # category x hour proxy computed before any model exists and disclaims
    # itself. Must equal artifacts/rho.json; strict mode refuses to start on
    # divergence, because these two values set deff and deff deflates every
    # posterior update. Re-paste after every retrain.
  mean_forced_hours_per_episode: 8.563 # MEASURED  ditto -> deff = 3.347

posterior:
    # The cell map is frozen into artifacts/posterior.json by
    # bootstrap.init_posterior and read from there at runtime; changing this
    # string alone has no effect. Subcategory cells are phase 2 (section 14).
  min_episodes_per_week_for_cell: 250  # SET  below this -> read the global cell
  epsilon_min: -4.00                   # SET  grid bound
  epsilon_max: -0.05                   # SET  sign constraint
  grid_size: 801                       # SET
  min_std: 0.05                        # SET  floor on posterior std
  path: "artifacts/posterior.json"
  prior:
    method: "profile_density"          # SET BY OWNER 2026-08-24.
      # "profile_density"  the prior IS the deff-deflated profile likelihood,
      #                    read as a density. A censored POISSON profile, so
      #                    `r` leaves the epsilon step by theorem (the Poisson
      #                    QMLE is consistent for the MEAN whatever the true
      #                    dispersion is) rather than by a measured
      #                    sensitivity -- that is what cuts epsilon <-> r.
      #                    NO fallback_mean, NO fallback_std, NO std_floor:
      #                    a category the data says nothing about degrades to
      #                    the uniform on the support and then borrows the
      #                    POOLED density, which is measured across categories.
      # "bracket"          PRD 9.5 as originally written: argmax of two arms,
      #                    midpoint and half-gap, with a constant fallback when
      #                    a category is rejected. Kept so an older run
      #                    reproduces exactly.
      #
      # The two are not as different as they look. A 50/50 mixture of two POINT
      # masses at a and b has mean (a+b)/2 and std |a-b|/2 -- exactly the
      # bracket's formula -- so profile_density reproduces it wherever both
      # arms are sharp, and widens instead of asserting false precision where
      # they are not. Measured on the fixture, four of five categories had a
      # likelihood span under 2.4 across the WHOLE support and two were exactly
      # constant, yet the bracket reported -4.000 +- 0.400 for them, because
      # argmax of a constant array returns index 0.
      #
      # Every run writes `holdout_comparison` scoring BOTH methods on data
      # neither saw. Read it before changing this key.
    rows: "entry"                      # SET  "entry" | "all_stocked_hours"
      # ENTRY ROWS, and PRD 9.5 said so from the start (owner, 2026-08-25).
      # Under the legacy ramp a row at a deep discount exists PRECISELY because
      # earlier hours did not sell, so within-episode rows carry a survivorship
      # confound. `all_stocked_hours` was tried to buy price variation and it
      # bought the confound with it, which is the larger effect.
      #
      # Both within-episode mechanisms push the same way. The ramp deepens the
      # discount as hours pass while demand rises into the evening, so discount
      # and demand climb together; and the episodes that SURVIVE to the deep
      # hours are the ones that were not selling, so conditional on a
      # price-neutral mu_ref a deeper price reads as lower demand.
      # `hour_of_day` is already a mu_ref feature and the controlled arm
      # profiles hour effects out on top -- so the first is handled twice, and
      # the sign STILL came out positive on 4 of 5 fixture categories, because
      # the second is selection on the unobserved demand shock and no hour
      # control reaches it. Entry rows have neither.
      #
      # Fixture, unconstrained peaks searched past the bound:
      #   entry              2 of 5 categories wrong-signed
      #   all_stocked_hours  4 of 5
      #
      # THE COST IS REAL AND IT IS THE OTHER HORN: entry rows carry far less
      # price variation, since the entry hour is before the ramp starts and
      # sits at or near d_ref. SIDE DISH goes from sd 0.024 to 0.0014. So the
      # choice is between weakly identified and confidently backwards -- and a
      # weak right-signed estimate degrades to the uniform on the support,
      # while a confident wrong-signed one is discarded entirely.
      #
      # `rows_comparison` in prior.json reports the sign outcome for BOTH sets
      # on every run. Read it before changing this key.
      #
      # Censored entry rows are KEPT now. The old bracket had to drop them --
      # its NB likelihood needed an `r` in exactly the term censoring fires --
      # and the Poisson profile has no dispersion parameter, so that selection
      # bias is gone.
    hour_control: "date_hour"          # SET  "date_hour" | "hour_of_day"
      # WHAT THE CONTROLLED ARM PROFILES OUT (owner, 2026-08-25).
      #
      # "hour_of_day"  the hour POOLED ACROSS DATES. Removes the average
      #                evening lift and nothing else, so a Tuesday storm or a
      #                rival's promotion is still in the residual -- and still
      #                correlated with how far the legacy ramp has run.
      # "date_hour"    the same clock hour OF THAT DAY, compared across
      #                sku x fc. Absorbs every shock common to that moment.
      #                This is what PRD 9.5 means by "same-hour cross-episode";
      #                the pooled hour control was only ever an approximation.
      #
      # It does NOT fix the within-episode survivorship confound -- two
      # episodes at 5pm on the same day differ in discount partly because one
      # of them has not been selling -- which is why `rows: entry` still
      # matters. The two controls are for different confounds and both are
      # needed.
      #
      # Read `identifying_variation_share` and `median_rows_per_time_cell`
      # after switching: a finer cell absorbs more, so LESS price variation
      # survives to identify epsilon.
    min_rows_per_time_cell: 5          # SET  a time cell with fewer uncensored
      # rows than this gets no multiplier of its own and falls back to 1.0.
      #
      # A CELL FITTED FROM THREE OBSERVATIONS ABSORBS THE PRICE RESPONSE IT IS
      # SUPPOSED TO CONTROL FOR -- the incidental parameters problem -- and it
      # biases |epsilon| TOWARD ZERO, the same direction the controlled arm is
      # already biased. Matters much more under "date_hour", where cells are
      # (day x hour) and can be thin.
    own_information_saturation: 2.0    # SET  log-likelihood units, across the
      # whole support, at which a category stops borrowing from the pool and
      # stands on its own data. 2.0 is the chi-square 95% cutoff: a category
      # that discriminates at least as much as its own significance threshold
      # is entitled to its own answer. Lower = more categories stand alone;
      # 0 = never pool. Reported per category as `own_information_weight`.
    holdout_window: "calib"            # SET  which split the comparison scores
      # on. Must be a window the prior did NOT see -- the whole point is that
      # neither method can be judged from the inside.
    source: "bracket"                  # SET  "bracket" | "fallback"
      # BRACKET METHOD ONLY, ignored under profile_density.
    fallback_mean: -1.00               # SET  BRACKET METHOD ONLY. Used if the
      # bracket is rejected -- and nothing measured produced it, which is the
      # objection that motivated profile_density. Unused under that method.
    fallback_std: 0.60                 # SET  BRACKET METHOD ONLY, ditto
    std_floor: 0.40                    # SET  BRACKET METHOD ONLY. Floor on the
      # bracket-derived std. profile_density needs no floor: the density's own
      # width is the floor.
    reference_r: null                  # SET  dispersion the BRACKET fits at.
      # null = MEASURE IT from the train window, PER CATEGORY, which is the
      # default and the right answer. `fit_r` at the fallback elasticity on
      # each category's entry rows, using the same estimator and the same
      # boundary clamp fit_dispersion uses. Reported as
      # `reference_r_by_category`, with `reference_r` the pooled fallback for a
      # category thinner than reference_r_min_rows, and `reference_r_basis`.
      #
      # Why derived rather than pinned: a pinned constant goes stale against a
      # retrain, has to be re-pasted by hand, and says nothing about the
      # extract in front of it. Deriving it costs one bounded scalar
      # minimisation per category.
      #
      # Why PER CATEGORY (owner, 2026-08-24): dispersion is a property of the
      # category, not of the extract, and the spread swamps the +-2x band the
      # approximation was justified over. Fixture entry rows, pooled 8.04:
      # SEAFOOD 1.60, VEGETABLE 5.39, FRUIT 14.12, MEAT 28.71, SIDE DISH at the
      # 50.0 search bound. Scoring SEAFOOD at the pooled value is not a small
      # error in a nuisance parameter, it is the wrong likelihood.
      #
      # A FIT AT A SEARCH BOUND IS NOT AN ESTIMATE. SIDE DISH above is
      # under-dispersed relative to Poisson, so the MLE runs to the ceiling.
      # Those are clamped at dispersion.clamp_percentile of the converged set --
      # the same key and the same treatment fit_dispersion applies, so the two
      # modules cannot drift on how a boundary is handled.
      #
      # WHY THIS IS FITTED HERE AND NOT READ FROM r_lookup.json: estimate_prior
      # runs BEFORE fit_dispersion, so that artifact does not exist yet on a
      # cold start. The two steps are genuinely circular -- the bracket's
      # likelihood needs r, and dispersion needs an elasticity -- and the loop
      # is cut on THIS side because it is far weaker here. Even were the
      # artifact present it would be the wrong number: it describes the
      # CALIBRATION window, and this likelihood sums over TRAIN entry rows.
      #
      # `r` reaches the bracket two ways. The strong one is the censored term
      # `nbinom.logsf(k-1, r, p)` -- how much mass sits above k is entirely a
      # dispersion question -- and it never fires, because censoring is decided
      # at an episode's LAST row while the bracket uses ENTRY rows, so a
      # censored entry row is a one-hour episode and those are dropped. What
      # remains is the weighting term `r/(r+mu)`, and fitting per category is
      # what keeps even that term honest.
      #
      # Against this, fitting DISPERSION at the wrong elasticity cost 26% of the
      # learning rate (-1.0 -> -1.5 moved rho 0.3103 -> 0.4236, deff
      # 3.347 -> 4.204). So the approximation belongs on this side.
      #
      # Set a number to PIN it -- reproducing an older run, or holding the
      # bootstrap against a known value. It then applies to EVERY category and
      # nothing is fitted.
    reference_r_min_rows: 150          # SET  entry rows a category needs to
      # fit its own reference r; below this it takes the pooled fit.
      #
      # SEPARATE FROM dispersion.min_rows_per_group (200) ON PURPOSE, because
      # the rows are not the same unit. That threshold counts calibration HOURS;
      # this one counts ENTRY rows, one per episode, so the same number would be
      # a far stricter bar and would silently push production categories onto
      # the pooled value. Reported per category as `reference_r_scope`, so
      # "category" vs "pooled" is visible rather than inferred.
    search_bounds: [-4.00, -0.05]      # SET  must equal [epsilon_min, epsilon_max]
    search_grid_size: 159              # SET  bracket search resolution
    max_rows_per_category: 150000      # SET  row cap per category in the bracket fit
    acceptance_scope: "per_category"   # SET BY OWNER 2026-08-24.
      # "per_category"    a category that passes its own checks keeps its own
      #                   bracket; only the failures take the fallback.
      # "all_or_nothing"  one failure replaces EVERY category. What PRD 9.5
      #                   originally specified, and it was costing real
      #                   information: BAKERY & PASTRY passed every check on
      #                   21,484 rows and was still overwritten with the
      #                   fallback because two other categories failed. Its own
      #                   bracket was -1.6125 +- 1.0875.
      #
      # The checks are pre-registered here, not chosen after seeing the
      # answers, so applying them per cell and using the cells that pass is not
      # selecting on the outcome.
    #
    # THE THREE CHECKS. Only the sign is unconditional -- see PRD 9.5, which
    # was amended for this. The owner's rule: a measured bracket beats an
    # assumption, and the SIGN is the thing worth rejecting on.
    reject_wrong_sign: true            # SET  NOT configurable in practice: a
      # non-negative endpoint says demand rises with price. Nonsensical, not
      # weak, and no midpoint of it means anything.
    reject_boundary_solutions: false   # SET BY OWNER 2026-08-24 (was true).
      # A bound-pinned endpoint is not point-identified, but it still carries
      # the sign and a magnitude floor -- "at least this elastic" is real
      # information, and -1.0 +- 0.6 is not. DAIRY PRODUCT pinned at -4.0 on
      # the production extract; under the old rule that discarded the whole
      # prior for all 16 categories.
    reject_orientation_violations: false  # SET BY OWNER 2026-08-24.
      # `naive > controlled`. FLAGGED LOUDLY, NOT REJECTED -- the owner's call,
      # and the argument for it is that a measured midpoint is still the best
      # reading the data supports, where the alternative is a constant.
      #
      # The caveat, recorded because it is real and the flag exists to carry
      # it: the bracket identifies a SET, and the argument is DIRECTIONAL --
      # naive absorbs the evening lift so it is biased too elastic, controlled
      # strips the confounded variation so it is biased toward zero, hence
      # naive <= eps_true <= controlled. That ordering is the only thing making
      # the midpoint set-identified. When it reverses, the midpoint is still
      # the centre of the two measurements but no longer a bracket on the
      # truth, so an inverted category's prior is weaker evidence than an
      # upright one's even though the artifact reports them the same way.
      #
      #   boundary   ordering intact, lower end truncated at the search bound.
      #              Conservative but sound: midpoint understates |eps|.
      #   inverted   ordering violated. Used, flagged, and listed at the top
      #              of the artifact as `inverted_categories`.
      #
      # Read `identifying_variation_share` before trusting one. The controlled
      # fit is identified ONLY by within-hour price variation; near zero it is
      # noise that can land anywhere, and the inversion says nothing about the
      # category -- pool hours or coarsen the control instead. BABY FOOD is the
      # live case: naive -1.55, controlled -2.7, both firmly negative,
      # midpoint -2.125 +- 0.575.
    path: "artifacts/prior.json"
    per_category: null                 # MEASURED  re-run section 9.5 after bound fix

pricing:
  tier_step: 0.025                     # SET  hourly discount grid granularity
  entry_offsets: [-0.15, -0.10, -0.05, 0.0, 0.05]  # SET  the ENTRY action set,
    # in discount percentage points RELATIVE TO the category reference: from
    # 15pp shallower than reference to one 5pp step deeper. Sign convention:
    # NEGATIVE = shallower discount = higher price.
    #
    # Spacing is a uniform 5pp on purpose. A +2.5pp arm was considered and
    # rejected: information about epsilon scales as (log price ratio)^2, so an
    # arm 2.5pp from the reference carries ~24% of the information of one 5pp
    # away, while taking an equal share of the uniform exploration draw. Fine
    # arms near the optimum dilute the evidence rather than adding to it. The
    # hourly grid stays at tier_step; only ENTRY is coarse.
    #
    # The single deeper arm is the escape valve for the clearance/scrap trade
    # (the replay's -12.0% IL came with -3.25pp clearance). It is an option,
    # not a default -- the DP takes it only when Q says so. Note the cost
    # floor removes it for the _default categories at cost ratios above ~0.65,
    # so it is available where margin allows and silently absent where not.
    #
    # Entry is a separate decision from the hourly one and deserves a
    # different grid. Monotonicity makes it irreversible: price may only hold
    # or deepen afterwards, so entry sets the ceiling on every later price in
    # the episode. Entering deeper than reference would spend margin in hour
    # one and forfeit the room to deepen later. And entry is where
    # identification lives (the confound-free variation is entry-hour
    # variation ACROSS episodes), so four well-separated arms give a far
    # sharper elasticity read than sixteen 2.5pp arms whose demand
    # differences sit inside the noise. Offsets are snapped to the tier grid
    # and filtered by the cost floor.
  negbin_max_k: 25                     # SET  demand truncation
  demand_floor: 0.01                   # SET

exploration:
  budget_share_of_il: 0.01             # SET  1% of markdown IL
  tau_initial: null                    # MEASURED  section 12.3. Paste ONLY
    # from `reports/backtest.json` -> tau_initial_derivation.tau_initial, and
    # only from a report written AFTER the entry-only scoping fix (its block
    # carries `spread_decisions`). Earlier derivations solved tau on ENTRY
    # decisions alone, funding roughly one exploration per episode against a
    # system that calls explore.select every hour -- wrong by about that
    # factor, and invisible, because the bisection reports 1.00x whatever
    # population it is handed. Any value pasted before that fix is void.
    # `pricing.explore.tau_provenance_error` enforces all of this: shadow
    # refuses to start on a stale paste and `pipeline.status` reports it.
    # It is a CURRENCY amount compared against Q(p*) - Q(p), never a rate.
  tau_adjust_clip: [0.5, 2.0]          # SET  max daily multiplicative change
  tau_spend_guard: 1.0                 # SET  divide-by-zero guard on realised cost, currency
  budget_scale_ref_std: 0.40           # SET  budget scales with std / this
  budget_scale_floor: 0.25             # SET  never below 25% of budget
  min_feasible_tiers: 2                # SET  below this: non-explorable

learning:
  information_increment: 12.0          # SET  effective info per update
  max_mean_step: 0.15                  # SET  bound per update cycle
  max_std_shrink: 0.25                 # SET  bound per update cycle
  use_exploitation_outcomes: false     # SET  do not change in MVP

events:
  store_dir: "events_store"            # SET  decision/outcome event log location
  shadow_store_dir: "events_store_shadow"  # SET  shadow-phase events kept separate

assurance:                             # pipeline.assurance -- live-data checks
  # 1 · reproduction: re-solve logged decisions from their own event payload
  reproduction_sample: 500             # SET  most RECENT decisions re-solved
  reproduction_discount_tol: 1.0e-9    # SET  tier grid is exact; this is float noise
  reproduction_il_tol_abs: 0.01        # SET  currency, absolute
  reproduction_il_tol_rel: 1.0e-6      # SET  relative, for large IL values
  reproduction_report_max: 10          # SET  failures listed in the report
  # 2 · dispersion: is live demand as lumpy as the frozen r claims
  dispersion_min_outcomes: 500         # SET  below this the bins are noise
  dispersion_bins: 4                   # SET  predicted-mu quantile bins
  dispersion_min_bin: 100              # SET  bins thinner than this are skipped
  dispersion_alert_z: 3.0              # SET  |z| on the binomial null
  # 3 · correlation: re-measure rho against the frozen artifact
  rho_min_episodes: 200                # SET  below this, do not re-measure
  rho_min_hours_per_episode: 3         # SET  matches bootstrap.fit_dispersion
  rho_drift_alert: 0.10                # SET  absolute drift in rho that alerts.
    # rho 0.3103 -> 0.41 moves deff 3.35 -> 4.1, ~22% of the learning rate.
    # Tighter than this fires on ordinary sampling noise at 200 episodes.
  # 4 · exploration: is the applied price a uniform draw from the affordable set
  uniformity_bins: 5                   # SET  chi-square bins on the mapped rank
  uniformity_min_draws: 100            # SET  below this, report insufficient
  uniformity_alert_p: 0.01             # SET  chi-square p-value floor

monitoring:
  guardrail_noise_window_days: 28      # SET  trailing baseline for threshold calibration
  shadow_gate:                         # SET  section 19 phase-1 exit gate
    min_event_completeness: 0.99
    min_matched_decision_rate: 0.99
    sample_episodes: 3000              # SET  0 = every episode. The gate reads
      # three rates and a violation count; a uniform episode sample estimates
      # all of them. Treating each EPISODE as one observation (conservative --
      # decisions within an episode are correlated, so this understates the
      # sample), the standard error on a rate near 0.99 is 0.18pp at 3,000 and
      # 0.10pp at 10,000, against the 1.00pp the gate discriminates on. Both
      # clear it by a wide margin, so 3,000 was chosen for run time: 10,000
      # took long enough to discourage re-running after a change, and a gate
      # nobody re-runs is worse than a slightly wider interval.
      # Sampling happens BEFORE mu_ref prediction, so the cost scales with the
      # sample, not the extract.
      # What it does NOT buy: "zero cost-floor violations" becomes zero over
      # the sample rather than over the window. That is acceptable because
      # cost-floor safety is structural -- the feasible action set cannot
      # express a below-cost price -- and separately unit-tested; the gate
      # confirms the property end-to-end, it does not establish it. At 3,000
      # the sample covers ~0.9% of the extract, so that caveat carries more
      # weight than it did at 10,000 -- run `--max-episodes 0` once for the
      # pre-launch record, where the full sweep is worth the wall clock.
  stop_conditions:
    duplicate_or_unmatched_rate: 0.01  # SET
    price_mismatch_rate: 0.01          # SET
    exploration_cost_vs_budget: 2.0    # SET
    deterioration_basis:               # SET  how each guardrail compares to
      scrap: "relative"                # its baseline. Changes what the
      margin: "absolute_pp"            # threshold MEANS, so it is explicit.
      # "relative"     t/c - 1. The right scale for a strictly positive rate
      #                whose level drifts: 20% worse means the same thing
      #                whatever this week's baseline is. Scrap works here --
      #                measured 3-sigma 0.4156 against a mean level of 0.1814,
      #                not outlier-dominated, worst observed 0.3789.
      # "absolute_pp"  t - c, in percentage points of the rate. REQUIRED when
      #                the metric can cross zero, because a ratio to a
      #                near-zero denominator has no scale.
      #
      # Margin is absolute_pp because it MEASURABLY crosses zero: on the
      # production extract the daily series runs mean 0.0308, min -0.0464, and
      # 36 of 134 days are at or below zero. On the relative basis that gave a
      # raw 3-sigma of 65.4497 (6,545%), robust 3.5853, worst observed 155.23
      # -- no threshold can sit above a floor larger than the series' own
      # level, so the stop condition was structurally impossible to set rather
      # than merely mistuned. Smoothing does not help: averaging a series that
      # changes sign averages across the crossing. On the absolute basis the
      # same series has a daily sigma of 0.0374, so a 3-sigma floor lands near
      # 11 percentage points -- and close to the 0.1363/0.15 recorded here
      # before the population changed.
      #
      # derive_thresholds emits `unusable_floor` on any RELATIVE floor >= 1.0,
      # so this failure announces itself next time instead of reading as
      # "margin is volatile".
    deterioration_smoothing_days:      # SET  days averaged BEFORE comparing,
      scrap: 7                         # per metric, chosen from measured noise
      margin: 1
      # The scrap rate averages ~1.76% of units, so ordinary daily swing is
      # enormous in RELATIVE terms: robust 3-sigma is 153%, which overlaps the
      # 100-200% breach the guardrail exists to catch. A guardrail whose noise
      # floor and failure mode are the same size is not a guardrail. Averaging
      # 7 days before comparing cuts the floor to ~58% (sigma falls ~1/sqrt k)
      # and separates them cleanly, at the cost of a few days' detection
      # latency -- the right trade for a condition that should fire on
      # sustained damage, not on one bad day.
      #
      # Margin needs none: its daily floor is 13.63% and it is not
      # outlier-dominated, so smoothing would only cost detection speed.
      # derive_thresholds measures each floor at ITS configured smoothing, so
      # the floor and the monitor always use the same yardstick.
    persistence_days: 2                # SET  a deterioration stop condition
      # fires only after this many CONSECUTIVE days over threshold. This is
      # what lets a threshold sit just above its measured noise floor without
      # false-firing: one day past a 3-sigma floor happens about once a year
      # per guardrail, two in a row essentially never. Load-bearing, not
      # decoration -- the scrap threshold clears its floor by ~6%.
    scrap_deterioration_pct: null      # SET BY OWNER -- blocks section 15.4.
      # Raw measured 3-sigma floor: 9.1386 -- these are RELATIVE deviations,
      # so that is 914%, not 9.14%. A few low-volume days dominate the daily
      # ratio series; no usable threshold sits above a floor larger than the
      # level itself. derive_thresholds now reports a MAD-based robust floor
      # and flags the series as outlier-dominated. Robust floor MEASURED on
      # production: 1.5282 -- that is 153% RELATIVE, still above 1.0, so the
      # daily scrap rate swings by more than its own level and NO threshold
      # on this basis is both safe and useful. See design section 12: the
      # trailing-mean basis is the wrong yardstick for this series; the
      # control-arm basis (same-day, cancels the day effect) is what the
      # monitor actually uses once the A/B is live, and is measured
      # separately as scrap_rate_control_arm_basis.
    margin_deterioration_pct: null     # SET BY OWNER -- blocks section 15.4.
      # Measured 3-sigma daily noise floor: 0.1363 (13.63%), robust 0.1494,
      # NOT outlier-dominated -- this one is well behaved. Recommended 0.15,
      # which clears the raw floor by ~10% but sits just UNDER the robust
      # 0.1494; the 2-day persistence rule is what covers that gap. Anything
      # at or under ~0.136 sits inside the noise band and will false-fire,
      # silently suspending exploration.
  alert_posterior_std_flat_days: 21    # SET  learning-loop health

ab_test:
  allocation: 0.50                     # SET
  power: 0.80                          # SET  for duration derivation
  alpha: 0.05                          # SET  two-sided
  candidate_durations_weeks: [2, 3, 4, 5, 6, 8, 10, 12]  # SET  windows tested
  min_episodes_per_block: 100          # SET  blocks below this are skipped
  min_detectable_effect_pct: null      # SET BY OWNER  relative on IL%
  il_pct_ratio_se_clustered: 0.000875  # MEASURED  phase 0; 84,792 SKU x FC
    # units. 6x the 0.000383 originally assumed -- that figure was a
    # pre-measurement placeholder and sat here mislabelled as MEASURED.
    # Not consumed for power: derive_thresholds re-measures the SE on actual
    # T-week blocks, since sqrt-T scaling is optimistic under clustering.
