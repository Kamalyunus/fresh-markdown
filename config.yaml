# Perishable Markdown MVP -- single tuning surface (design section 5.1).
#
# Every threshold, constant, window, and rate in the system lives here.

meta:
  config_version: "1.0.0"

artifacts:
  bundle_path: "artifacts/bundle.json"   # SET  the sealed bundle manifest

data:
  split_manifest_path: "artifacts/split_manifest.json"   # SET
  exclusion_window:                    # SET  known demand-issue period
    start: "2026-04-25"
    end:   "2026-06-03"
  split:                               # SET BY OWNER  sized by the design 6 rules: calib >= 2W, test/holdout are pure GRADING windows, no window crosses the exclusion gap
    train_start: "2026-03-01"
    train_end:   "2026-06-28"
    calib_start: "2026-06-29"
    calib_end:   "2026-07-26"
    test_start:  "2026-07-27"
    test_end:    "2026-08-09"
  holdout:                             # SET  a TRUE hold-out -- no artifact is fit on it and no gate was decided on it. ONE SHOT: tune a value on it and it stops being one
    start: "2026-08-10"
    end:   "2026-08-28"
  max_window_hours: 120                # SET  upper bound on a plausible FLC window; a longer one is FLAGGED window_too_long, not dropped
  manufacturing_window_hours: 24       # SET  synthetic countdown for SKUs whose flc_window enters already negative

reassessment_gates:                    # SET  phase-0 review gates (design 5.3)
  max_share_non_explorable: 0.30       # above this, narrow the MVP to the explorable subset
  max_share_cells_low_variation: 0.50  # above this, expect the prior to degrade toward pooled/uniform (a designed outcome)

baseline_model:
  objective: "tweedie"                 # SET
  tweedie_variance_power: 1.3          # SET
  ref_rate_window_days: 30             # SET  trailing window for sku_ref_sales_rate
  ref_rate_anchor_band: 0.025          # SET  |d - d_ref| band defining anchor hours
  learning_rate: 0.05                  # SET
  num_boost_round: 400                 # SET
  num_leaves: 63                       # SET
  min_data_in_leaf: 50                 # SET
  model_path: "artifacts/baseline_model.txt"
  feature_schema_path: "artifacts/feature_schema.json"
  calibration_gate_band: [0.90, 1.10]  # MEASURED by pipeline.tune from weekly volatility; DIAGNOSTIC, and may only TIGHTEN from here
  calibration_convergence_tol_log: 0.02  # SET  the f<->r chain is circular; above this max |log(f_new/f_old)| the fixed point has not settled
  calibration_shrinkage_units: 100     # SET  pseudo-count, in anchor units
  calibration_min_anchor_rows: 200     # SET  anchor basis needs this many rows
  mix_decomposition_min_unit_rows: 30  # SET  anchor rows before a SKU x FC unit gets its own ratio
  calibration_window_sweep_weeks: [1, 2, 4, 8]  # SET  windows the rolling-origin sweep scores to choose W
  calibration_fit_trailing_weeks: 2    # MEASURED by the sweep; W, and calib must be >= 2W (design 6)
  calibration_factor_path: "artifacts/calibration.json"   # per-category level correction

reference_discount:                    # SET  category anchors
  MEAT: 0.25
  SIDE_DISH: 0.25
  _default: 0.30

dispersion:
  clamp_percentile: 0.90               # SET  clamp high converged r
  min_rows_per_group: 200              # SET  below this: fall back one level
  r_search_bounds: [0.05, 50.0]        # SET  MLE search range for r
  r_lookup_path: "artifacts/r_lookup.json"
  rho_path: "artifacts/rho.json"
  rho: 0.2436                          # MEASURED  fit_dispersion, on the calib window; mirrors artifacts/rho.json
  mean_forced_hours_per_episode: 5.909 # MEASURED  ditto -> deff = 2.196

tuning:                                # SET  gates pipeline.tune checks before auto-applying
  max_price_share_changed_for_auto_rail: 0.10   # SET  auto-rail ceiling on price churn
  max_il_delta_pct_for_auto_rail: 0.005         # SET  auto-rail ceiling on the IL move
  calibration_band_sigma_multiple: 3            # SET  band = this many sigma of log f
  calibration_band_max_half_width: 0.10         # SET BY OWNER  ceiling; tune may only tighten

posterior:
  min_episodes_per_week_for_cell: 150  # SET  below this, fall back to the global cell
  epsilon_min: -4.00                   # SET  grid bound
  epsilon_max: -0.05                   # SET  sign constraint
  grid_size: 801                       # SET
  min_std: 0.05                        # SET  floor on posterior std
  path: "artifacts/posterior.json"
  prior:
    min_rows_per_time_cell: 5          # SET  thinner time cells are dropped
    own_information_saturation: 2.0    # SET  log-lik units that count as informative
    stability_folds: 3                 # SET  disjoint train slices for fold_spread
    search_grid_size: 159              # SET  profile resolution
    max_rows_per_category: 150000      # SET  row cap per category
    path: "artifacts/prior.json"

pricing:
  tier_step: 0.025                     # SET  hourly discount grid granularity
  entry_offsets: [-0.15, -0.10, -0.05, 0.0, 0.05]  # SET  the ENTRY action set
  negbin_max_k: 25                     # SET  demand truncation
  demand_floor: 0.01                   # SET

exploration:
  budget_share_of_il: 0.01             # SET BY OWNER  exploration spend, share of markdown IL
  tau_initial: null                    # MEASURED  shadow derives the launch tau; ships null
  tau0_derivation_min_decisions: 500   # SET  floor for shadow's launch-tau
  tau_adjust_clip: [0.5, 1.25]         # SET  max daily multiplicative change in tau
  tau_spend_guard: 1.0                 # SET  divide-by-zero guard on realised cost, currency
  budget_il_window_days: 7             # SET  the IL base for a day's budget
  budget_scale_ref_std: 0.40           # SET  budget scales with std / this
  budget_scale_floor: 0.25             # SET  never below 25% of budget
  min_feasible_tiers: 2                # SET  below this: non-explorable

learning:
  information_increment: 12.0          # MEASURED  deff-deflated NB info per bounded update
  max_mean_step: 0.15                  # SET BY OWNER, gated  cap on one update's mean move
  max_std_shrink: 0.25                 # SET BY OWNER  the PRIMARY rate limit on learning

events:
  store_dir: "events_store"            # SET  decision/outcome event log location
  shadow_store_dir: "events_store_shadow"  # SET  shadow-phase events kept separate

assurance:                             # pipeline.assurance -- live-data checks
  reproduction_sample: 500             # SET  most RECENT decisions re-solved
  reproduction_discount_tol: 1.0e-9    # SET  tier grid is exact; this is float noise
  reproduction_il_tol_abs: 0.01        # SET  currency, absolute
  reproduction_il_tol_rel: 1.0e-6      # SET  relative, for large IL values
  reproduction_report_max: 10          # SET  failures listed in the report
  dispersion_min_outcomes: 500         # SET  below this the bins are noise
  dispersion_bins: 4                   # SET  predicted-mu quantile bins
  dispersion_min_bin: 100              # SET  bins thinner than this are skipped
  dispersion_alert_z: 3.0              # SET  |z| on the binomial null
  rho_min_episodes: 200                # SET  below this, do not re-measure
  rho_min_hours_per_episode: 3         # SET  matches bootstrap.fit_dispersion
  rho_drift_alert: 0.10                # SET  absolute drift in rho that alerts.
  uniformity_bins: 5                   # SET  chi-square bins on the mapped rank
  uniformity_min_draws: 100            # SET  below this, report insufficient
  uniformity_alert_p: 0.01             # SET  chi-square p-value floor

monitoring:
  guardrail_noise_window_days: 28      # SET  trailing baseline for threshold calibration
  shadow_gate:                         # SET  the phase-1 exit gate (design 5.13)
    min_event_completeness: 0.99
    min_matched_decision_rate: 0.99
    sample_episodes: 3000              # SET  0 = every episode
  stop_conditions:
    duplicate_or_unmatched_rate: 0.01  # SET
    price_mismatch_rate: 0.01          # SET
    exploration_cost_vs_budget: 2.0    # SET
    deterioration_smoothing_days:      # SET  days averaged BEFORE comparing
      scrap: 7                         # per metric, chosen from measured noise
      margin: 1
    persistence_days: 2                # SET  consecutive days before a stop fires
    scrap_deterioration_pct: null      # MEASURED  3-sigma of the trailing noise
    margin_deterioration_pct: null     # MEASURED  3-sigma of the trailing noise
  alert_posterior_std_flat_days: 21    # SET  learning-loop health

ab_test:
  allocation: 0.50                     # SET
  power: 0.80                          # SET  for duration derivation
  alpha: 0.05                          # SET  two-sided
  candidate_durations_weeks: [2, 3, 4, 5, 6, 8, 10, 12]  # SET  windows tested
  min_episodes_per_block: 100          # SET  blocks below this are skipped
  min_detectable_effect_pct: null      # SET BY OWNER  relative effect on IL%
